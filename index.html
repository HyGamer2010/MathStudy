<head>
    <script src="https://unpkg.com/function-plot/dist/function-plot.js"></script>

    <script>
        problem_sets = {
            "APCalcAB": {
                "Unit4": [
                    "Linearization",
                    "RelatedRates"
                ]
            }
        }

        var problem_set = ""
        var category = ""
        var problem_display
        var problem_answer
        var problem_explanation
        var problems_json_files = {}

        document.addEventListener('DOMContentLoaded', (event) => {
            Object.entries(problem_sets).forEach(set => {
                Object.entries(set[1]).forEach(category => {
                    document.getElementsByClassName(set[0] + category[0])[0].addEventListener('change', (event) => {
                        if(event.target.checked){
                            select_all_box()
                        }
                    })
                })
            });
            problem_display = document.getElementById("problem_display")
            problem_answer = document.getElementById("problem_answer")
            problem_explanation = document.getElementById("problem_explanation")
        })

        problem_types_selected = []


        function select_all_box(){
            elements = document.getElementsByClassName(problem_set + category)
            for (var el of elements){
                el.checked = true
            }
        }

        function select_menu(from_id, to_id){
            var from = document.getElementById(from_id)
            var to = document.getElementById(to_id)

            from.hidden = true
            to.hidden = false
        }
        function select_category(problem_set, category){
            select_menu(problem_set, problem_set + category)

            this.problem_set = problem_set
            this.category = category
        }
        function set_element(element, hidden){
            document.getElementById(element).hidden = hidden
        }
        function generate_problem(){
            problem_explanation.hidden = true
            document.getElementById("answer_div").hidden = true 

            problem_type = problem_types_selected[Math.floor(Math.random() * problem_types_selected.length)]
            switch (problem_type) {
                case "Linearization":
                    problems = problems_json_files[problem_type].Linearization
                    break;
                case "RelatedRates":
                    problems = problems_json_files[problem_type].RelatedRates
                    break;
                default:
                    break;
            }
            problem = problems[Math.floor(Math.random() * problems.length)]
            problem = problems[6]
            inner = ""
            for(var line of problem.Problem){
                inner += `${line}<br>`
            }
            problem_display.innerHTML = inner

            inner = ""
            for(var line of problem.Answer){
                inner += `${line}<br>`
            }
            problem_answer.innerHTML = inner

            inner = ""
            for(var line of problem.Explanation){
                inner += `${line}<br>`
            }
            problem_explanation.innerHTML = inner
        }

        async function begin(){
            select_menu(problem_set + category, "problems")

            elements = document.getElementsByClassName(problem_set + category)
            all = false
            problems_json_files = {}
            for(el of elements){
                if(el.value == "All" && el.checked){
                    all = true
                }
                else if(el.checked || all){
                    problem_types_selected.push(el.value)
                    problems_json_files[el.value] = await load_json(el.value)
                }
            }

            generate_problem()
        }

        function draw_graph(xaxis, yaxis, funcs){
            data = []
            for(func of funcs){
                data.push({
                    fn: func,
                    color: '#0071e3',
                    graphType: 'polyline'
                })
            }

            functionPlot({
                target: '#graph',
                width: 400,
                height: 400,
                grid: true,
                xAxis: xaxis,
                yAxis: yaxis,
                data: data
            })
        }
        
        async function load_json(problem_set) {
            const problems_file = await fetch(`./${problem_set}.json`)
            return await problems_file.json()
        }
    </script>
    <style>
        .title {
            width:100%;
            text-align: center;
            font-family: monospace;
        }
        div {
            font-family: monospace;
            font-size: large;
        }
    </style>
    <title>Math Study App</title>
</head>
<body>
    <h1 class="title">Math Study App</h1>
    <div id="initial">
        <button onclick='select_menu("initial", "APCalcAB")'>AP Calc AB</button>
    </div>
    <div id="selection">
        <div id="APCalcAB" hidden="true">
            <button onclick='select_category("APCalcAB", "Unit4")'>Unit 4</button>
            <button onclick='select_menu("APCalcAB", "initial")'>Back</button>
        </div>
        <div id="APCalcABUnit4" hidden="true">
            <!-- <select>
                <option value="All">All</option>
                <option value="Linearization">Linearization</option>
            </select> -->
            <fieldset>
                <legend>Choose</legend>

                <input type="checkbox" value="All" class="APCalcABUnit4">
                <label>All</label>

                <input type="checkbox" value="Linearization" class="APCalcABUnit4">
                <label>Linearization</label>

                <input type="checkbox" value="RelatedRates" class="APCalcABUnit4">
                <label>Related Rates</label>
            </fieldset>
            <button onclick="begin()">Begin</button>
        </div>
    </div>
    <div id="problems" hidden="true">
        <div id="problem_display"></div>
        <button onclick='set_element("answer_div", false)'>Reveal Answer</button>
        <div id="answer_div" hidden="true">
            <p id="problem_answer"></p>
            <p>Different answer? Check explanation</p>
            <button onclick='select_menu("answer_div", "problem_explanation")'>Check explanation</button>
        </div>
        <div id="problem_explanation" hidden="true"></div>
        <button onclick='generate_problem()'>Next</button>
        <button onclick='select_menu("problems", problem_set + category)'>Back</button>
    </div>
</body>
