<!DOCTYPE html>
<head>
    <script src="https://unpkg.com/function-plot/dist/function-plot.js"></script>

    <script>
        MathJax = {
          loader: {
            load: ['input/asciimath', 'output/chtml', 'ui/menu']
          }
        };
    </script>	
    <script src="https://cdn.jsdelivr.net/npm/mathjax@4/startup.js" defer></script>
    <script src="ASCIIMathML.js"></script>

    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Math Study App</title>
</head>
<body>
    <header class="title" id="MainHeader">
        <h1>Math Study App</h1>
    </header>
    <!-- <div id="initial">
        <button onclick='select_menu("initial", "APCalcAB")'>AP Calc AB</button>
    </div> -->
    <section>
        <nav>
            <button onclick='select_subject("APCalcAB")'>AP Calc AB</button>
            <button onclick='select_subject("AdvancedMath")'>Advanced Math</button>
            <button onclick='select_subject("Changelog")'>Changelog</button>
            <button onclick='window.location.href="contribute.html"'>How to Contribute</button>
        </nav>
        <main id="selection">
            <header class="title" id="APCalcABHeader" hidden="true"><h2>AP Calc AB</h2></header>
            <div id="APCalcAB" hidden="true">
                <div class="sect">
                    <button class="category" onclick='select_category("APCalcAB", "Unit3")'>Unit 3</button>
                    <button class="category" onclick='select_category("APCalcAB", "Unit4")'>Unit 4</button>
                    <button class="category" onclick='select_category("APCalcAB", "Unit5")'>Unit 5</button>
                </div>
            </div>

            <header class="title" id="AdvancedMathHeader" hidden="true"><h2>Advanced Math</h2></header>
            <div id="AdvancedMath" hidden="true">
                <div class="sect">
                    <button class="category" onclick='select_category("AdvancedMath", "Unit6")'>Unit 6</button>
                </div>
            </div>

            <header class="title" id="ChangelogHeader" hidden="true"><h2>Changelog</h2></header>
            <div class="sect" id="Changelog" hidden="true">
                
            </div>
            <!-- AP Calc Units -->
            <div class="sect" id="APCalcABUnit3" hidden="true">
                <fieldset>
                    <legend>Choose Topics to Include</legend>
    
                    <input type="checkbox" value="All" class="APCalcABUnit3">
                    <label>All</label>
                    <br>
    
                    <input type="checkbox" value="ChainRule" class="APCalcABUnit3">
                    <label>Chain Rule</label>
                    <br>
    
                    <input type="checkbox" value="ImplicitDifferentiation" class="APCalcABUnit3">
                    <label>Implicit Differentiation</label>
                    <br>
                </fieldset>
                <button onclick="begin()">Begin</button>
            </div>
            <div class="sect" id="APCalcABUnit4" hidden="true">
                <fieldset>
                    <legend>Choose Topics to Include</legend>
    
                    <input type="checkbox" value="All" class="APCalcABUnit4">
                    <label>All</label>
                    <br>
    
                    <input type="checkbox" value="Linearization" class="APCalcABUnit4">
                    <label>Linearization</label>
                    <br>
    
                    <input type="checkbox" value="RelatedRates" class="APCalcABUnit4">
                    <label>Related Rates</label>
                    <br>
                </fieldset>
                <button onclick="begin()">Begin</button>
            </div>
            <div class="sect" id="APCalcABUnit5" hidden="true">
                <fieldset>
                    <legend>Choose Topics to Include</legend>
    
                    <input type="checkbox" value="All" class="APCalcABUnit5">
                    <label>All</label>
                    <br>

                    <input type="checkbox" value="SVA" class="APCalcABUnit5">
                    <label>Distance, Velocity, Acceleration</label>
                    <br>
                </fieldset>
                <button onclick="begin()">Begin</button>
            </div>
            <!-- Advanced Math Units -->
            <div class="sect" id="AdvancedMathUnit6" hidden="true">
                <fieldset>
                    <legend>Choose Topics to Include</legend>
    
                    <input type="checkbox" value="All" class="AdvancedMathUnit6">
                    <label>All</label>
                    <br>
    
                    <input type="checkbox" value="Laws" class="AdvancedMathUnit6">
                    <label>Law of Sines and Cosines</label>
                    <br>

                    <input type="checkbox" value="AOBT" class="AdvancedMathUnit6">
                    <label>Area of oblique triangles</label>
                    <br>

                    <input type="checkbox" value="Vectors" class="AdvancedMathUnit6">
                    <label>Vectors</label>
                    <br>

                    <input type="checkbox" value="Imaginary" class="AdvancedMathUnit6">
                    <label>Imaginary Numbers</label>
                    <br>
                </fieldset>
                <button onclick="begin()">Begin</button>
            </div>
            <div class="sect" id="problems" hidden="true">
                <div id="problem_display"></div>
                <button onclick='set_element("answer_div", false)'>Reveal Answer</button>
                <div id="answer_div" hidden="true">
                    <p id="problem_answer"></p>
                    <p>Different answer? Check explanation</p>
                    <button onclick='set_element("problem_explanation", false)'>Check explanation</button>
                </div>
                <p id="problem_explanation" hidden="true"></p>
                <button onclick='generate_problem()'>Next</button>
                <button onclick='select_menu("problems", problem_set + category)'>Back</button>
            </div>
        </main>
        <aside>
        </aside>
    </section>
    <footer>
        <div>
            Contact me at sonict2010@gmail.com
        </div>
    </footer>
</body>
